    <form id="formInscription" class="form-page" action="#" method="get">
  <h2 class="h5 mb-3"><i class="bi bi-person-vcard"></i> Informations personnelles</h2>

  <div class="mb-3 ">
    <div class="row">
        <div class=" col-md-6">
    <label for="nom" class="form-label">Nom</label>
    <input type="text" class="form-control" id="nom" name="nom" placeholder="Votre nom"></div>
    <div class=" col-md-6">
    <label for="nom" class="form-label">Adresse e-mail</label>
    <input type="email" class="form-control form-control-lg"
       id="email" name="email" placeholder=" nom@exemple.com"></div>
    <div class=" col-md-6">
    <label for="nom" class="form-label">Mot de passe</label>
    <input type="password" class="form-control" id="mdp" name="mdp" placeholder="Votre password"></div>
    <div class=" col-md-6">
    <label for="nom" class="form-label">Téléphone</label>
    <input type="tel" class="form-control" id="tel" name="tel" placeholder="20 123 45"></div>

    <div class=" col-md-6">
    <label for="nom" class="form-label">Date de naissance</label>
    <input type="date" class="form-control" id="naissance" name="naissance" ></div>
    <div class=" col-md-6">
    <label for="nom" class="form-label">Âge</label>
    <input type="number" class="form-control" id="Âge" name="Âge" placeholder="Votre age"></div>
    <div class=" col-md-6">
    <label for="site" class="form-label">
        Site web ou profil LinkedIn
    </label>
    <input type="url" class="form-control" id="site" name="site"
           placeholder="https://www.github.com"></div>
        <div class=" col-md-6">
    <label for="heure" class="form-label">
        Heure de disponibilité pour un appel
    </label>
    <input type="time" class="form-control" id="heure" name="heure"></div>
  </div></div>

  <!-- Q2.2 : compléter avec les autres champs -->

<!-- Section Formation souhaitée -->

<section class="mb-4">

    <h2 class="h5 mb-3">
        <i class="bi bi-mortarboard"></i>
        Formation souhaitée
    </h2>

    <div class="row">

        <!-- Domaine -->
        <div class="col-md-6 mb-3">
            <label for="domaine" class="form-label">Domaine</label>

            <select class="form-select" id="domaine" name="domaine">
                <option selected disabled value="">Choisir un domaine</option>
                <option value="web">Développement web</option>
                <option value="mobile">Développement mobile</option>
                <option value="reseaux">Réseaux</option>
                <option value="bureautique">Bureautique</option>
            </select>
        </div>

        <!-- Langages -->
        <div class="col-md-6 mb-3">
            <label for="langages" class="form-label">
                Langages déjà pratiqués
            </label>

            <select class="form-select" id="langages" name="langages[]" multiple size="4">
                <option value="HTML">HTML</option>
                <option value="CSS">CSS</option>
                <option value="JavaScript">JavaScript</option>
                <option value="PHP">PHP</option>
                <option value="Dart">Dart</option>
                <option value="Python">Python</option>
            </select>
        </div>

        <!-- Motivation -->
        <div class="col-md-6 mb-3">
            <label for="motivation" class="form-label">Motivation</label>

            <textarea class="form-control" id="motivation" name="motivation"
                      rows="4"
                      placeholder="Expliquez votre motivation..."></textarea>
        </div>

        <!-- Ville -->
        <div class="col-md-6 mb-3">
            <label for="ville" class="form-label">Ville</label>

            <input type="text" class="form-control" id="ville"
                   name="ville" list="villes"
                   placeholder="Choisir ou saisir une ville">

            <datalist id="villes">
                <option value="Tunis">
                <option value="Nabeul">
                <option value="Sousse">
                <option value="Sfax">
                <option value="Bizerte">
                <option value="Monastir">
            </datalist>
        </div>

        <!-- Couleur -->
        <div class="col-md-6 mb-3">
            <label for="couleur" class="form-label">
                Couleur préférée pour votre badge
            </label>

            <input type="color" class="form-control form-control-color"
                   id="couleur" name="couleur" value="#0d6efd">
        </div>

        <!-- CV -->
        <div class="col-md-6 mb-3">
            <label for="cv" class="form-label">CV (PDF)</label>

            <input type="file" class="form-control" id="cv"
                   name="cv" accept=".pdf">
        </div>

    </div>
</section>




           <div class="mb-3">
  <label for="niveau" class="form-label">
    Niveau en informatique :
    <span id="niveauValeur" class="badge text-bg-primary">5</span>
  </label>
  <input type="range" class="form-range" id="niveau"
         name="niveau" min="0" max="10" step="1" value="5">
</div>
</section>

  <button type="submit" class="btn btn-primary">Envoyer</button>
